      afterResponse: |-
        insomnia.test('Status code is 201', () => {
            insomnia.expect(insomnia.response.code).to.eql(201);
        });

        insomnia.test('Item criado com sucesso', () => {
            if (insomnia.response.code === 201) {
                const data = insomnia.response.json();
                insomnia.expect(data).to.have.property('message');
