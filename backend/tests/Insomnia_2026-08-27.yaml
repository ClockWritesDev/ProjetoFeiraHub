      text: |-
        {
          "nome_item": "Banana Prata",
          "provedor": "Hortifruti do Zé",
          "foto": "https://exemplo.com/banana.jpg",
          "preco_varejo": 6.50,
          "preco_atacado": 4.50,
          "estoque": 100,
          "vendidos": 0
        }
